name: Build Standalone GUI Installers (.dmg & .exe)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-macos:
    name: Build macOS (${{ matrix.target }} - .dmg ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: Apple Silicon
            runner: macos-14
          - arch: x86_64
            target: Intel
            runner: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone App & DMG
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_standalone.py --output dist

      - name: Verify DMG & Binary Integrity
        shell: bash
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          dmg_file="dist/Subterranean-Staircase-macos-${MATRIX_ARCH}.dmg"
          echo "Verifying DMG: $dmg_file"
          test -s "$dmg_file"
          hdiutil verify "$dmg_file"
          lipo -info "dist/Subterranean Staircase.app/Contents/MacOS/Subterranean Staircase" | grep "${MATRIX_ARCH}"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Subterranean-Staircase-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  build-windows-x64:
    name: Build Windows x64 (.exe Setup & Portable ZIP)
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Inno Setup (Windows Installer Compiler)
        shell: pwsh
        run: |
          choco install innosetup --version 6.3.3 --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Standalone Windows Executable & Installer
        shell: pwsh
        run: |
          python scripts/build_standalone.py --output dist

      - name: Verify Windows Artifacts
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in '.exe', '.zip' }
          if ($artifacts.Count -eq 0) {
              Write-Error "No Windows distribution artifacts found in dist/"
              exit 1
          }
          foreach ($art in $artifacts) {
              if ($art.Length -eq 0) {
                  Write-Error "Artifact is empty (0 bytes): $($art.FullName)"
                  exit 1
              }
              Write-Host "Found artifact: $($art.FullName) ($([math]::Round($art.Length / 1MB, 2)) MB)"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Subterranean-Staircase-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish Artifacts to GitHub Release
    needs: [build-macos, build-windows-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@c952df4f26d373a62d844ef7b815f7161a8a0a08 # v2.0.8
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
