name: Build Standalone GUI Installers (.dmg & .exe)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-macos:
    name: Build macOS (${{ matrix.target }} - .dmg ${{ matrix.arch }})
    runs-on: macos-14
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: Apple Silicon
            python-arch: arm64
          - arch: x86_64
            target: Intel
            python-arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10 (Apple Silicon)
        if: matrix.arch == 'arm64'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Python 3.10 (Intel Universal2 Package)
        if: matrix.arch == 'x86_64'
        run: |
          curl -fsSL -o /tmp/python-3.10.pkg https://www.python.org/ftp/python/3.10.11/python-3.10.11-macos11.pkg
          sudo installer -pkg /tmp/python-3.10.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.10/bin" >> $GITHUB_PATH

      - name: Install dependencies
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            arch -x86_64 python3.10 -m pip install --upgrade pip
            arch -x86_64 python3.10 -m pip install -r requirements.txt
          else
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          fi

      - name: Build Standalone App & DMG
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            arch -x86_64 python3.10 scripts/build_standalone.py --output dist
          else
            python scripts/build_standalone.py --output dist
          fi

      - name: Verify DMG & Binary Integrity
        shell: bash
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          dmg_file="dist/Subterranean-Staircase-macos-${MATRIX_ARCH}.dmg"
          echo "Verifying DMG: $dmg_file"
          test -s "$dmg_file"
          hdiutil verify "$dmg_file"
          lipo -info "dist/Subterranean Staircase.app/Contents/MacOS/Subterranean Staircase" | grep "${MATRIX_ARCH}"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Subterranean-Staircase-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  build-windows-x64:
    name: Build Windows x64 (.exe Setup & Portable ZIP)
    runs-on: windows-2022
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Inno Setup on PATH
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
              if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
                  echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              } elseif (Test-Path "C:\ProgramData\Chocolatey\bin\iscc.exe") {
                  echo "C:\ProgramData\Chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              }
          }

      - name: Build Standalone Windows Executable & Installer
        shell: pwsh
        run: |
          python scripts/build_standalone.py --output dist

      - name: Verify Windows Artifacts
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in '.exe', '.zip' }
          if ($artifacts.Count -eq 0) {
              Write-Error "No Windows distribution artifacts found in dist/"
              exit 1
          }
          foreach ($art in $artifacts) {
              if ($art.Length -eq 0) {
                  Write-Error "Artifact is empty (0 bytes): $($art.FullName)"
                  exit 1
              }
              Write-Host "Found artifact: $($art.FullName) ($([math]::Round($art.Length / 1MB, 2)) MB)"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Subterranean-Staircase-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish Artifacts to GitHub Release
    needs: [build-macos, build-windows-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" release-assets/* \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
